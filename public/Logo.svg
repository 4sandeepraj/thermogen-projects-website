<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
    <defs>
      <!-- Blue Front Face Linear Gradient -->
      <linearGradient id="blueFront" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stopColor="#0096FF" />
        <stop offset="45%" stopColor="#007EE5" />
        <stop offset="100%" stopColor="#0066D6" />
      </linearGradient>

      <!-- Blue Chamfer / Bevel Inset Highlight -->
      <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#66BAFF" stopOpacity="0.9" />
        <stop offset="100%" stopColor="#005CB8" stopOpacity="0.3" />
      </linearGradient>

      <!-- Orange Front Face Linear Gradient -->
      <linearGradient id="orangeFront" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stopColor="#FFA126" />
        <stop offset="40%" stopColor="#FF7E00" />
        <stop offset="100%" stopColor="#E65800" />
      </linearGradient>

      <!-- Orange Chamfer / Bevel Inset Highlight -->
      <linearGradient id="orangeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FFC570" stopOpacity="0.9" />
        <stop offset="100%" stopColor="#BD4000" stopOpacity="0.3" />
      </linearGradient>

      <!-- Ambient Studio Floor Shadow Filter -->
      <filter id="studioShadow" x="-15%" y="-15%" width="135%" height="135%">
        <feDropShadow dx="8" dy="18" stdDeviation="16" floodColor="#041E3A" floodOpacity="0.3" />
        <feDropShadow dx="2" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.2" />
      </filter>
    </defs>

